<!doctype html>
<html class="h-full">

<head>
    <title>WireGuard AllowedIPs Calculator</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/pyodide/v0.29.3/full/pyodide.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .loader {
            width: 20px;
            height: 12px;
            display: block;
            margin: auto;
            position: relative;
            border-radius: 4px;
            background: currentColor;
            box-sizing: border-box;
            animation: animloader 0.6s 0.3s ease infinite alternate;
        }

        .loader::after,
        .loader::before {
            content: '';
            box-sizing: border-box;
            width: 20px;
            height: 12px;
            background: currentColor;
            position: absolute;
            border-radius: 4px;
            top: 0;
            right: 110%;
            animation: animloader 0.6s ease infinite alternate;
        }

        .loader::after {
            left: 110%;
            right: auto;
            animation-delay: 0.6s;
        }

        @keyframes animloader {
            0% {
                width: 20px;
            }

            100% {
                width: 48px;
            }
        }
    </style>
</head>

<body class="min-h-full bg-white dark:bg-gray-900 text-gray-900 dark:text-gray-100">
    <div class="flex flex-col min-h-screen">
        <div class="p-6 md:p-12 lg:px-40 flex-grow">
            <h1 class="text-3xl md:text-4xl mb-2">WireGuard AllowedIPs Calculator</h1>
            <p class="text-gray-600 dark:text-gray-400 mb-6">A simple calculator for the WireGuard AllowedIPs field. All processing happens locally in your browser using <a class="hover:underline text-blue-600 dark:text-blue-400" href="https://pyodide.org/">Pyodide</a>.</p>
            <form class="grid grid-cols-1 md:grid-cols-[10em,auto] gap-4 md:gap-2">
                <label class="md:text-right md:self-center font-medium" for="allowedips">Allowed IPs:</label>
                <input class="rounded-md border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 p-2 focus:outline-none focus:ring-2 focus:ring-blue-500 dark:focus:ring-blue-400 transition" type="text" id="allowedips" name="allowedips" placeholder="0.0.0.0/0, ::0/0">
                <label class="md:text-right md:self-center font-medium" for="disallowedips">Disallowed IPs:</label>
                <input class="rounded-md border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 p-2 focus:outline-none focus:ring-2 focus:ring-blue-500 dark:focus:ring-blue-400 transition" type="text" id="disallowedips" name="disallowedips" placeholder="10.0.0.0/8, 192.168.0.0/16, fc00::/7">
                <div class="md:col-start-2 flex justify-start">
                    <button type="button" class="inline-flex items-center px-6 py-2 text-sm font-medium text-white bg-gradient-to-r from-blue-600 to-blue-700 hover:from-blue-700 hover:to-blue-800 dark:from-blue-500 dark:to-blue-600 dark:hover:from-blue-600 dark:hover:to-blue-700 rounded-md shadow-md hover:shadow-lg transition-all" id="calc">
                        Calculate
                    </button>
                </div>
            </form>
            <div class="pt-6">
                <h2 class="text-xl md:text-2xl mb-2">Result</h2>
                <p class="bg-gray-100 dark:bg-gray-800 p-4 font-mono rounded-md border border-gray-200 dark:border-gray-700" id="result" hidden="true">
                    <span class="loader"></span>
                </p>
            </div>
        </div>
        <div class="bg-gray-200 dark:bg-gray-800 p-4 lg:px-40 text-center md:text-left">
            <span>&lt;/&gt; with ❤ by <a class="font-semibold hover:underline text-gray-800 dark:text-gray-200" href="https://github.com/banksio">banksio</a></span>
        </div>
    </div>
    <script type="module" src="main.js"></script>
</body>

</html>
